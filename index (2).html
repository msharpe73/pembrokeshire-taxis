<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pembrokeshire Taxis</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; }
    #loading { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0369a1; }
    #loading div { background:white; border-radius:24px; padding:40px; text-align:center; }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">
      <div>
        <div style="font-size:48px">🚐</div>
        <h1 style="font-weight:900;font-size:24px;margin:8px 0">Pembrokeshire Taxis</h1>
        <p style="color:#6b7280">Loading...</p>
      </div>
    </div>
  </div>

  <script>
    // Storage API shim using localStorage
    window.storage = {
      get: async (key) => {
        try {
          const val = localStorage.getItem(key);
          return val ? { key, value: val } : null;
        } catch { return null; }
      },
      set: async (key, value) => {
        try {
          localStorage.setItem(key, value);
          return { key, value };
        } catch { return null; }
      },
      delete: async (key) => {
        try {
          localStorage.removeItem(key);
          return { key, deleted: true };
        } catch { return null; }
      },
      list: async (prefix) => {
        try {
          const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
          return { keys };
        } catch { return { keys: [] }; }
      }
    };
  </script>

  <!-- Load Babel and then the app -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script>
    // Load app.js as text and compile with Babel
    fetch('app.js')
      .then(r => r.text())
      .then(code => {
        const transformed = Babel.transform(code, {
          presets: ['react'],
          plugins: []
        }).code;
        const script = document.createElement('script');
        script.textContent = transformed;
        document.body.appendChild(script);
      })
      .catch(err => {
        document.getElementById('root').innerHTML = 
          '<div style="padding:20px;color:red">Error loading app: ' + err.message + '</div>';
      });
  </script>
</body>
</html>
